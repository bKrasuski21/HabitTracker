name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            artifact: HabitTracker-linux-x86_64
          - os: macos-latest
            name: macos
            artifact: HabitTracker-macos
          - os: windows-latest
            name: windows-x86_64
            artifact: HabitTracker-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libudev-dev libgl-dev libfreetype-dev

      - name: Configure CMake (macOS universal binary)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure CMake
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ${{ matrix.artifact }}/data
          cp build/HabitTracker ${{ matrix.artifact }}/
          cp font.ttf ${{ matrix.artifact }}/
          chmod +x ${{ matrix.artifact }}/HabitTracker
          tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ${{ matrix.artifact }}/data
          cp build/HabitTracker ${{ matrix.artifact }}/
          cp font.ttf ${{ matrix.artifact }}/
          chmod +x ${{ matrix.artifact }}/HabitTracker
          tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p ${{ matrix.artifact }}/data
          cp build/Release/HabitTracker.exe ${{ matrix.artifact }}/
          cp font.ttf ${{ matrix.artifact }}/
          7z a ${{ matrix.artifact }}.zip ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
